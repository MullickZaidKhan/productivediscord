<title>Logo loader v2</title>
<style>
:root {
  --bg: #14141a; --fg: #fff; --muted: #9a9aa8; --btn: #26262f;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { height: 100%; }
body {
  margin: 0; min-height: 100%; background: var(--bg); color: var(--fg);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 28px; padding: 24px;
}
.logo { width: min(260px, 70vw); height: auto; animation: bob 2.6s ease-in-out infinite; }
@keyframes bob {
  0%, 100% { transform: translateY(0) rotate(-1.5deg); }
  50%      { transform: translateY(-8px) rotate(1.5deg); }
}
.body { animation: glow 2.6s ease-in-out infinite; }
@keyframes glow {
  0%, 100% { opacity: .75; filter: drop-shadow(0 0 0 rgba(255,255,255,0)); }
  50%      { opacity: 1;   filter: drop-shadow(0 0 22px rgba(255,255,255,.5)); }
}

/* variant visibility */
g.waves, g.rays { display: none; }
body.mode-waves g.waves, body.mode-rays g.rays { display: inline; }

/* waves: arcs radiate outward one after another */
.waves path { opacity: 0; animation: wave 1.8s ease-out infinite; }
.waves path:nth-child(2) { animation-delay: 0s; }
.waves path:nth-child(1) { animation-delay: .25s; }
.waves path:nth-child(3) { animation-delay: .5s; }
.waves path:nth-child(4) { animation-delay: .75s; }
@keyframes wave {
  0%   { opacity: 0; transform: translateX(-40px); }
  25%  { opacity: 1; }
  70%  { opacity: 0; transform: translateX(30px); }
  100% { opacity: 0; transform: translateX(30px); }
}

/* rays: spikes burst out from the head */
.rays path { opacity: 0; transform-origin: 2040px 1010px; animation: ray 1.6s ease-out infinite; }
.rays path:nth-child(2) { animation-delay: 0s; }
.rays path:nth-child(1) { animation-delay: .2s; }
.rays path:nth-child(3) { animation-delay: .4s; }
@keyframes ray {
  0%   { opacity: 0; transform: scale(.4); }
  30%  { opacity: 1; transform: scale(1); }
  70%  { opacity: 1; transform: scale(1.12); }
  100% { opacity: 0; transform: scale(1.2); }
}

@media (prefers-reduced-motion: reduce) {
  .logo, .body, .waves path, .rays path { animation: none !important; }
  .waves path, .rays path { opacity: 1; }
}

.controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
button {
  background: var(--btn); color: var(--fg); border: 1px solid #3a3a46;
  padding: 8px 16px; border-radius: 8px; font: inherit; cursor: pointer;
}
button[aria-pressed="true"] { background: #fff; color: #14141a; }
button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
p { margin: 0; color: var(--muted); font-size: 14px; }
</style>
